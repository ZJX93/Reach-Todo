<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" role="img" aria-label="Reach monochrome logo">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500&display=swap');
      .brand{font-family:'Sora',sans-serif;}
      .cjk{font-family:'Noto Sans SC',sans-serif;}
    ]]></style>
  </defs>

  <!-- 亮底版本（墨色） -->
  <rect width="580" height="170" fill="#FFFFFF"/>
  <rect x="24" y="25" width="120" height="120" rx="28" fill="#15262C"/>
  <g stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M64 110 L104 70"/>
    <path d="M84 70 L104 70 L104 90"/>
  </g>
  <text class="brand" x="170" y="83" font-size="66" font-weight="700" fill="#15262C">Reach</text>
  <text class="brand" x="172" y="119" font-size="22" font-weight="500" fill="#5B7780" letter-spacing="6">
    <tspan class="cjk">抵达</tspan><tspan> · TODO</tspan>
  </text>

  <!-- 暗底版本（白色） -->
  <rect y="190" width="580" height="170" fill="#15262C"/>
  <rect x="24" y="215" width="120" height="120" rx="28" fill="#FFFFFF"/>
  <g stroke="#15262C" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M64 300 L104 260"/>
    <path d="M84 260 L104 260 L104 280"/>
  </g>
  <text class="brand" x="170" y="273" font-size="66" font-weight="700" fill="#FFFFFF">Reach</text>
  <text class="brand" x="172" y="309" font-size="22" font-weight="500" fill="#9FB4BA" letter-spacing="6">
    <tspan class="cjk">抵达</tspan><tspan> · TODO</tspan>
  </text>
</svg>
