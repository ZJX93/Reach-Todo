<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Reach 图形标">
  <defs>
    <linearGradient id="glyphBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E97A8"/>
      <stop offset="1" stop-color="#0A7382"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板（App 图标） -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#glyphBg)"/>

  <!-- 罗盘外环 -->
  <circle cx="128" cy="128" r="78" fill="none" stroke="#E3F4F5" stroke-opacity="0.30" stroke-width="2"/>

  <!-- 四向刻度 -->
  <g stroke="#E3F4F5" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
    <line x1="128" y1="44"  x2="128" y2="58"/>
    <line x1="128" y1="198" x2="128" y2="212"/>
    <line x1="44"  y1="128" x2="58"  y2="128"/>
    <line x1="198" y1="128" x2="212" y2="128"/>
  </g>

  <!-- 指南针双色指针（指向右上 = 抵达） -->
  <g>
    <!-- 头部：白色实心 -->
    <path d="M188 68 L138.6 138.5 L128 128 L117.4 117.5 Z" fill="#FFFFFF"/>
    <!-- 尾部：浅青半透明 -->
    <path d="M92 166 L138.6 138.5 L128 128 L117.4 117.5 Z" fill="#E3F4F5" fill-opacity="0.55"/>
    <!-- 中心轴点 -->
    <circle cx="128" cy="128" r="9" fill="#0A7382"/>
    <circle cx="128" cy="128" r="4.5" fill="#FFFFFF"/>
  </g>
</svg>
