<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 440" role="img" aria-label="Reach logo concepts v2">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500&display=swap');
      .brand{font-family:'Sora',sans-serif;}
      .cjk{font-family:'Noto Sans SC',sans-serif;}
    ]]></style>
  </defs>
  <rect width="660" height="440" fill="#FFFFFF"/>

  <text class="brand" x="40" y="48" font-size="28" font-weight="700" fill="#15262C">Reach 标志方案 · 二稿</text>
  <text class="brand" x="40" y="72" font-size="13" font-weight="500" fill="#5B7780" letter-spacing="2">更克制、更独有 · 单一青蓝 · 抵达语义</text>

  <!-- 1 · 上升轨迹（推荐） -->
  <rect x="40" y="110" width="120" height="120" rx="28" fill="#0E97A8"/>
  <path d="M64 286 C 84 244, 104 232, 138 210" stroke="#FFFFFF" stroke-width="12" fill="none" stroke-linecap="round"/>
  <circle cx="138" cy="210" r="9" fill="#FFFFFF"/>
  <rect x="40" y="110" width="62" height="22" rx="11" fill="#15262C"/>
  <text class="brand" x="50" y="125" font-size="12" font-weight="600" fill="#FFFFFF">推荐</text>
  <text class="brand" x="40" y="258" font-size="16" font-weight="600" fill="#15262C">1 · 上升轨迹</text>
  <text class="brand" x="40" y="280" font-size="13" font-weight="500" fill="#5B7780">一条线抵达终点，优雅独有</text>

  <!-- 2 · 靶心达成 -->
  <rect x="190" y="110" width="120" height="120" rx="28" fill="#0E97A8"/>
  <circle cx="250" cy="170" r="36" stroke="#FFFFFF" stroke-width="12" fill="none"/>
  <circle cx="250" cy="170" r="10" fill="#FFFFFF"/>
  <text class="brand" x="190" y="258" font-size="16" font-weight="600" fill="#15262C">2 · 靶心达成</text>
  <text class="brand" x="190" y="280" font-size="13" font-weight="500" fill="#5B7780">圆环+中心点，目标达成</text>

  <!-- 3 · 山巅 -->
  <rect x="340" y="110" width="120" height="120" rx="28" fill="#0E97A8"/>
  <polyline points="356,280 384,222 406,258 428,204 452,280" stroke="#FFFFFF" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="brand" x="340" y="258" font-size="16" font-weight="600" fill="#15262C">3 · 山巅</text>
  <text class="brand" x="340" y="280" font-size="13" font-weight="500" fill="#5B7780">右侧最高峰，登顶抵达</text>

  <!-- 4 · 信号抵达 -->
  <rect x="490" y="110" width="120" height="120" rx="28" fill="#0E97A8"/>
  <path d="M530 272 A24 24 0 0 0 506 248" stroke="#FFFFFF" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M548 272 A42 42 0 0 0 506 230" stroke="#FFFFFF" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M566 272 A60 60 0 0 0 506 212" stroke="#FFFFFF" stroke-width="9" fill="none" stroke-linecap="round"/>
  <circle cx="506" cy="272" r="6" fill="#FFFFFF"/>
  <text class="brand" x="490" y="258" font-size="16" font-weight="600" fill="#15262C">4 · 信号抵达</text>
  <text class="brand" x="490" y="280" font-size="13" font-weight="500" fill="#5B7780">扩散波纹，连接与触达</text>

  <!-- 推荐组合标示例 -->
  <g transform="translate(16.67,260.83) scale(0.5833)">
    <rect x="40" y="170" width="120" height="120" rx="28" fill="#0E97A8"/>
    <path d="M64 286 C 84 244, 104 232, 138 210" stroke="#FFFFFF" stroke-width="12" fill="none" stroke-linecap="round"/>
    <circle cx="138" cy="210" r="9" fill="#FFFFFF"/>
  </g>
  <text class="brand" x="125" y="348" font-size="30" font-weight="700" fill="#15262C">Reach</text>
  <text class="brand" x="127" y="372" font-size="14" font-weight="500" fill="#5B7780" letter-spacing="4">
    <tspan class="cjk">抵达</tspan><tspan> · TODO</tspan>
  </text>
  <text class="brand" x="40" y="408" font-size="14" font-weight="600" fill="#15262C">推荐组合标示例（上升轨迹）</text>
  <text class="brand" x="40" y="428" font-size="12" font-weight="500" fill="#5B7780">图标 + 字形，web / 文档 / 商店图通用</text>
</svg>
