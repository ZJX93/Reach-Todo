<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Reach 徽章">
  <defs>
    <linearGradient id="badgeBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E97A8"/>
      <stop offset="1" stop-color="#0A7382"/>
    </linearGradient>
  </defs>

  <!-- 徽章底盘 -->
  <circle cx="128" cy="128" r="122" fill="url(#badgeBg)"/>

  <!-- 双描边环 -->
  <circle cx="128" cy="128" r="113" fill="none" stroke="#E3F4F5" stroke-opacity="0.85" stroke-width="2.5"/>
  <circle cx="128" cy="128" r="104" fill="none" stroke="#E3F4F5" stroke-opacity="0.45" stroke-width="1.2"/>

  <!-- 顶部弧文字 -->
  <path id="topArc" d="M 38 128 A 90 90 0 0 1 218 128" fill="none"/>
  <text fill="#FFFFFF" font-family="'Sora','Noto Sans SC',sans-serif" font-size="20" font-weight="600" letter-spacing="4">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">REACH · TODO</textPath>
  </text>

  <!-- 底部弧文字（中文 slogan） -->
  <path id="botArc" d="M 44 128 A 84 84 0 0 0 212 128" fill="none"/>
  <text fill="#E3F4F5" fill-opacity="0.9" font-family="'Noto Sans SC','Sora',sans-serif" font-size="14" font-weight="500" letter-spacing="2">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">让每一天都有迹可循</textPath>
  </text>

  <!-- 中心指南针指针（缩小版） -->
  <g transform="translate(128 132) scale(0.62) translate(-128 -128)">
    <circle cx="128" cy="128" r="78" fill="none" stroke="#E3F4F5" stroke-opacity="0.30" stroke-width="2"/>
    <g stroke="#E3F4F5" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
      <line x1="128" y1="44"  x2="128" y2="58"/>
      <line x1="128" y1="198" x2="128" y2="212"/>
      <line x1="44"  y1="128" x2="58"  y2="128"/>
      <line x1="198" y1="128" x2="212" y2="128"/>
    </g>
    <path d="M188 68 L138.6 138.5 L128 128 L117.4 117.5 Z" fill="#FFFFFF"/>
    <path d="M92 166 L138.6 138.5 L128 128 L117.4 117.5 Z" fill="#E3F4F5" fill-opacity="0.55"/>
    <circle cx="128" cy="128" r="9" fill="#0A7382"/>
    <circle cx="128" cy="128" r="4.5" fill="#FFFFFF"/>
  </g>

  <!-- 顶部小星点 -->
  <circle cx="128" cy="20" r="3" fill="#E3F4F5"/>
</svg>
