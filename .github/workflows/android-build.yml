name: Android CI (Build & Release APK)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag/名称（留空则用默认 Reach-Todo.APP-v0.0.1）'
        required: false
        default: 'Reach-Todo.APP-v0.0.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Provide google-services.json
        run: |
          TARGET="${{ github.workspace }}/android/app/google-services.json"
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON }}" > "$TARGET"
          else
            printf '%s' '{"project_info":{"project_number":"000000000000","project_id":"reach-todo-placeholder","storage_bucket":"reach-todo-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.zjx93.reach"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyD000000000000000000000000000000000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > "$TARGET"
          fi

      - name: Build with Gradle (assembleDebug)
        run: ./gradlew assembleDebug --no-daemon

      - name: Decide versions and rename APK
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION_INPUT="${{ github.event.inputs.version }}"
          else
            VERSION_INPUT="Reach-Todo.APP-v0.0.1"
          fi
          ANDROID_VERSION=$(echo "$VERSION_INPUT" | sed -n 's/.*\(v[0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p')
          [ -z "$ANDROID_VERSION" ] && ANDROID_VERSION="v0.0.1"
          APK_NAME="Reach-Todo.android-${ANDROID_VERSION}.apk"

          SRC="${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk"
          DST="${{ github.workspace }}/android/app/build/outputs/apk/debug/${APK_NAME}"
          cp "$SRC" "$DST"

          echo "tag=$VERSION_INPUT" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.apk_name }}
          path: android/app/build/outputs/apk/debug/${{ steps.ver.outputs.apk_name }}

      - name: Publish APK to GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: android/app/build/outputs/apk/debug/${{ steps.ver.outputs.apk_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
