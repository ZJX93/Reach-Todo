name: Android CI (Build & Release APK)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag/名称（留空则用默认 Reach-Todo.APP-v0.0.1）'
        required: false
        default: 'Reach-Todo.APP-v0.0.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Provide google-services.json
        run: |
          TARGET="${{ github.workspace }}/android/app/google-services.json"
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            printf '%s' "${{ secrets.GOOGLE_SERVICES_JSON }}" > "$TARGET"
          else
            printf '%s' '{"project_info":{"project_number":"000000000000","project_id":"reach-todo-placeholder","storage_bucket":"reach-todo-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.zjx93.reach"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyD000000000000000000000000000000000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > "$TARGET"
          fi

      - name: Build with Gradle (assembleDebug)
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          SRC="${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk"
          DST="${{ github.workspace }}/android/app/build/outputs/apk/debug/Reach-Todo.android-v0.0.1.apk"
          cp "$SRC" "$DST"

      - name: Upload APK (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Reach-Todo.android-v0.0.1
          path: android/app/build/outputs/apk/debug/Reach-Todo.android-v0.0.1.apk

      - name: Decide release tag
        id: tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=Reach-Todo.APP-v0.0.1" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish APK to GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: android/app/build/outputs/apk/debug/Reach-Todo.android-v0.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
