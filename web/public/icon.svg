<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Reach">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E97A8"/>
      <stop offset="1" stop-color="#0A7382"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 罗盘外环 -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#E3F4F5" stroke-opacity="0.30" stroke-width="4"/>

  <!-- 四向刻度 -->
  <g stroke="#E3F4F5" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round">
    <line x1="256" y1="46"  x2="256" y2="76"/>
    <line x1="256" y1="436" x2="256" y2="466"/>
    <line x1="46"  y1="256" x2="76"  y2="256"/>
    <line x1="436" y1="256" x2="466" y2="256"/>
  </g>

  <!-- 指南针双色指针（指向右上 = 抵达） -->
  <path d="M397.4 114.6 L288.5 288.5 L256 256 L223.5 223.5 Z" fill="#FFFFFF"/>
  <path d="M150 362 L288.5 288.5 L256 256 L223.5 223.5 Z" fill="#E3F4F5" fill-opacity="0.6"/>
  <circle cx="256" cy="256" r="22" fill="#0A7382"/>
  <circle cx="256" cy="256" r="11" fill="#FFFFFF"/>
</svg>
